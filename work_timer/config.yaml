name: Work Timer
version: 0.1.11
slug: work_timer
description: Keeps a work timer for one or more users and writes completed intervals to a Home Assistant calendar.
url: https://github.com/VelloMagu/work-timer
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false
homeassistant_api: true
hassio_api: true
ingress: true
ingress_port: 8097
ports:
  8097/tcp: 8097
panel_icon: mdi:timer-outline
panel_title: Work Timer
options:
  calendar_name: ""
  token: ""
  port: 8097
  users:
    - panel
schema:
  calendar_name: str
  token: password
  port: port
  users:
    - str
